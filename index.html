<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小小清单</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f4f7f4;
  color: #243b35;
  font-family: system-ui, "Microsoft YaHei", sans-serif;
  line-height: 1.6;
}
main { max-width: 720px; margin: 60px auto; padding: 0 20px; }
h1 { font-size: 38px; margin-bottom: 8px; }
.subtitle, footer { color: #64736c; }
.card {
  margin-top: 28px;
  padding: 26px;
  background: white;
  border: 1px solid #e1e8e1;
  border-radius: 20px;
  box-shadow: 0 12px 40px #254b3210;
}
label { display: block; margin-bottom: 8px; }
form > div { display: flex; gap: 10px; }
#text {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border: 1px solid #ccd8cf;
  border-radius: 9px;
  font: inherit;
}
button {
  padding: 10px 15px;
  border: 0;
  border-radius: 9px;
  font: inherit;
  cursor: pointer;
}
.add { background: #28634f; color: white; }
.filters { display: flex; gap: 6px; margin-top: 24px; }
.filters button { background: #f1f5f0; color: #52655a; }
.filters button[aria-pressed="true"] {
  background: #28634f;
  color: white;
}
#count, #status { color: #64736c; font-size: 14px; }
ul { list-style: none; padding: 0; margin: 0; }
li {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 15px 0;
  border-top: 1px solid #edf0eb;
}
li label {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
  min-width: 0;
  margin: 0;
}
li input { width: 20px; height: 20px; accent-color: #28634f; }
li span { overflow-wrap: anywhere; }
.done span { text-decoration: line-through; color: #839088; }
.delete { background: #fcf0ef; color: #8a4b4b; flex-shrink: 0; }
#empty { text-align: center; color: #64736c; padding: 25px 0; }
footer { text-align: center; font-size: 12px; margin-top: 22px; }
:focus-visible { outline: 3px solid #70ac94; outline-offset: 3px; }
@media (max-width: 520px) {
  main { margin: 30px auto; padding: 0 16px; }
  .card { padding: 20px 16px; }
  form > div { flex-direction: column; }
  .filters button { flex: 1; }
}
</style>
</head>
<body>
<main>
  <p class="subtitle">一步一步，做好每一天</p>
  <h1>小小清单 ✦</h1>
  <p class="subtitle">把想做的事写下来，从一件小事开始。</p>

  <section class="card">
    <form id="form">
      <label for="text">添加一件待办事项</label>
      <div>
        <input id="text" placeholder="例如：学习 20 分钟"
               maxlength="200" autocomplete="off" required>
        <button class="add" type="submit">＋ 添加</button>
      </div>
    </form>

    <div class="filters" role="group" aria-label="筛选任务">
      <button type="button" data-filter="all" aria-pressed="true">全部</button>
      <button type="button" data-filter="active" aria-pressed="false">未完成</button>
      <button type="button" data-filter="completed" aria-pressed="false">已完成</button>
    </div>

    <p id="count"></p>
    <ul id="list" aria-label="任务列表"></ul>
    <p id="empty"></p>
    <p id="status" role="status" aria-live="polite"></p>
  </section>

  <footer>
    数据保存在当前浏览器，无需登录。<br>
    清除浏览器数据会删除清单。
  </footer>
</main>

<script>
const key = "xiaoxiao-todo-single-v1";
const form = document.querySelector("#form");
const input = document.querySelector("#text");
const list = document.querySelector("#list");
const status = document.querySelector("#status");
const buttons = document.querySelectorAll("[data-filter]");
let tasks = [];
let filter = "all";

// 读取以前保存的清单。
try {
  const saved = localStorage.getItem(key);
  if (saved !== null) {
    const data = JSON.parse(saved);
    if (!Array.isArray(data) || !data.every(task =>
      task && typeof task.text === "string" &&
      typeof task.completed === "boolean"
    )) throw new Error("数据格式错误");
    tasks = data;
  }
} catch {
  status.textContent = "无法读取本地数据，请检查浏览器存储设置。";
}

function save(message) {
  try {
    localStorage.setItem(key, JSON.stringify(tasks));
    status.textContent = message;
  } catch {
    status.textContent = "未能保存，刷新后可能丢失。浏览器可能限制了本地文件的存储。";
  }
}

function render() {
  list.replaceChildren();

  const visible = tasks.filter(task =>
    filter === "all" ||
    (filter === "completed" ? task.completed : !task.completed)
  );

  visible.forEach(task => {
    const item = document.createElement("li");
    item.className = task.completed ? "done" : "";

    const label = document.createElement("label");
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = task.completed;

    checkbox.addEventListener("change", () => {
      task.completed = checkbox.checked;
      save(task.completed ? "任务已完成！" : "已改为未完成。");
      render();
      document.querySelector(`[data-filter="${filter}"]`).focus();
    });

    const text = document.createElement("span");
    text.textContent = task.text;
    label.append(checkbox, text);

    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "delete";
    remove.textContent = "删除";
    remove.setAttribute("aria-label", "删除任务：" + task.text);
    remove.addEventListener("click", () => {
      tasks = tasks.filter(existing => existing !== task);
      save("任务已删除。");
      render();
      input.focus();
    });

    item.append(label, remove);
    list.append(item);
  });

  const remaining = tasks.filter(task => !task.completed).length;
  document.querySelector("#count").textContent =
    `共 ${tasks.length} 项 · ${remaining} 项未完成`;

  const empty = document.querySelector("#empty");
  empty.hidden = visible.length > 0;
  empty.textContent = {
    all: "还没有任务，写下你的第一件小事吧。",
    active: "暂时没有未完成任务。",
    completed: "还没有已完成任务，完成后点击方框打勾。"
  }[filter];

  buttons.forEach(button => {
    button.setAttribute("aria-pressed",
      String(button.dataset.filter === filter));
  });
}

form.addEventListener("submit", event => {
  event.preventDefault();
  const text = input.value.trim();

  if (!text) {
    status.textContent = "请输入任务内容，不能只有空格。";
    input.focus();
    return;
  }

  tasks.push({ text, completed: false });
  filter = "all";
  save("任务已添加并保存。");
  input.value = "";
  render();
  input.focus();
});

buttons.forEach(button => {
  button.addEventListener("click", () => {
    filter = button.dataset.filter;
    render();
  });
});

render();
</script>
</body>
</html>
